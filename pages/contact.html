<div class="page-content">
  <h1 class="page-title" data-i18n="contact.title">Contact Us</h1>
  <div class="page-section">
    <p data-i18n="contact.desc">Have a question or feedback? We'd love to hear from you!</p>
    
    <div class="contact-form card">
      <div class="form-group">
        <label data-i18n="contact.name">Name</label>
        <input type="text" class="form-input" placeholder="Your Name" />
      </div>
      <div class="form-group">
        <label data-i18n="contact.email">Email</label>
        <input type="email" class="form-input" placeholder="your@email.com" />
      </div>
      <div class="form-group">
        <label data-i18n="contact.subject">Subject</label>
        <input type="text" class="form-input" placeholder="What is this regarding?" />
      </div>
      <div class="form-group">
        <label data-i18n="contact.message">Message</label>
        <textarea class="form-textarea" rows="5" placeholder="Your message..."></textarea>
      </div>
      <button class="btn-primary" data-i18n="contact.submit">Send Message</button>
    </div>

    <div class="contact-info" style="margin-top: 2rem;">
      <p><strong data-i18n="contact.emailLabel">Email:</strong> <a href="mailto:info@wdbloog.com">info@wdbloog.com</a></p>
      <p><strong data-i18n="contact.websiteLabel">Website:</strong> <a href="https://wdbloog.com" target="_blank">wdbloog.com</a></p>
    </div>
  </div>
</div>
